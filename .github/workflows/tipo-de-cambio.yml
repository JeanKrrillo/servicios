# Una vez al día lee el tipo de cambio FIX de Banxico y, si el que usan los precios debe cambiar, lo guarda y vuelve a publicar.
# Necesita el secreto BANXICO_TOKEN (Settings, Secrets and variables, Actions). El token se pide gratis en el sitio del SIE de Banxico.
# Si el valor en uso no cambia, no hay commit. Antes de publicar desde la compu, git pull trae el valor nuevo.
name: Tipo de cambio

on:
  schedule:
    - cron: '30 19 * * 1-5'   # 13:30 en el centro de México, después de que Banxico publica el FIX
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar Banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node .github/tipo-de-cambio.mjs
      - name: Guardar y volver a publicar si cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tipo-de-cambio.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "tipo-de-cambio"
          git config user.email "actions@users.noreply.github.com"
          git add tipo-de-cambio.json
          git commit -m "Tipo de cambio del día"
          git push
          gh workflow run publicar.yml --ref main
